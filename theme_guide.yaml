# テーマ別ページに載せる解説（themes.yaml のテーマ名と同じキーで書く）
# - seo:   検索で使われやすい呼び方（ページのタイトル・見出しに使う。例「宇宙関連株」）
# - about: どんなテーマか
# - why:   なぜ注目されているか（材料）
# - watch: 今後の注目点（イベント・指標）
# - risk:  注意点
# 内容が古くなったら書き換える（株価・点数などの数字は自動で入るので、ここには書かない）

半導体製造装置:
  seo: 半導体製造装置関連株
  about: 半導体をつくるための装置（露光・洗浄・検査・切断・搬送など）をつくる企業のテーマです。東京エレクトロン、アドバンテスト、ディスコ、レーザーテックなど、世界シェアの高い日本企業が多い分野です。
  why:
    - 生成AI向けの先端半導体（GPU・HBMなど）の需要が伸び、半導体メーカーの設備投資が続いている
    - 先端パッケージ（チップを積み重ねる技術）の広がりで、検査・切断・搬送装置の出番が増えている
    - 米国の半導体株（SOX指数）との連動が強く、前日の米国市場の動きがそのまま材料になりやすい
  watch:
    - エヌビディアなど米国半導体企業の決算と、TSMC・サムスン・SKハイニックスの設備投資計画
    - 半導体の対中輸出規制の動き
    - 各社の受注額（受注は売上より先に動く）
  risk:
    - 半導体の需要は景気の波が大きく、設備投資が止まると業績が急に悪化しやすい
    - 米中対立による輸出規制の強化

AI・データセンター:
  seo: AI・データセンター関連株
  about: 生成AIを動かすデータセンターの建設・運営に関わる企業のテーマです。光ファイバーや電線（フジクラ・古河電工・住友電工）、クラウド（さくらインターネット）、ITサービス（日立・富士通）などが含まれます。
  why:
    - 生成AIの普及で、世界中でデータセンターの建設が続いている
    - データセンター内をつなぐ光ファイバー・光部品の需要が急増している
    - 国内でも政府の支援でAI計算基盤（GPUクラウド）の整備が進んでいる
  watch:
    - 米国の大手IT企業（マイクロソフト・アマゾン・グーグル・メタ）の設備投資額
    - エヌビディアの決算
    - 国内データセンターの建設計画と電力の確保
  risk:
    - AI投資が過熱しすぎているとの見方が強まると、関連株がまとめて売られやすい
    - 期待で株価が先に上がっているため、決算で少しでも期待に届かないと大きく下がることがある

サイバーセキュリティ:
  seo: サイバーセキュリティ関連株
  about: 不正アクセスやウイルスから企業・行政を守るソフトやサービスを提供する企業のテーマです。トレンドマイクロ、デジタルアーツ、FFRI、サイバーセキュリティクラウドなどが含まれます。
  why:
    - ランサムウェア（身代金ウイルス）による企業・病院・自治体の被害が続き、対策への投資が増えている
    - 国の「能動的サイバー防御」の制度づくりなど、安全保障の面からも対策が求められている
    - 生成AIを悪用した攻撃が増え、防御側の需要も広がっている
  watch:
    - 大きなサイバー攻撃の報道（直後に関連株が買われやすい）
    - 政府の予算・制度の動き
  risk:
    - 小型株が多く、ニュースで短期的に乱高下しやすい
    - 話題が落ち着くと買われた分がはげ落ちやすい

フィジカルAI・ロボット:
  seo: ロボット・フィジカルAI関連株
  about: 工場の自動化（FA）や産業用ロボット、ロボットの部品をつくる企業のテーマです。AIで現実の機械を動かす「フィジカルAI」の広がりで注目されています。ファナック、安川電機、キーエンス、SMC、ハーモニックドライブなどが含まれます。
  why:
    - 人手不足で、工場・物流倉庫の自動化への投資が続いている
    - AIでロボットを動かす技術（ヒト型ロボット・自動搬送など）が進み、新しい需要が期待されている
    - 減速機やセンサーなど、ロボットに欠かせない部品で日本企業のシェアが高い
  watch:
    - 中国の設備投資の動向（FA関連は中国向けの比率が高い）
    - 工作機械受注・ロボット受注の月次統計
    - 米国のヒト型ロボット開発企業の動き
  risk:
    - 景気の影響を受けやすく、設備投資が減ると受注が落ちる
    - ヒト型ロボットなどへの期待が先行しやすい

量子コンピューター:
  seo: 量子コンピューター関連株
  about: 従来のコンピューターでは時間がかかりすぎる計算を解けると期待される「量子コンピューター」の開発・関連技術に関わる企業のテーマです。富士通、NEC、フィックスターズなどが含まれます。
  why:
    - 国産の量子コンピューターの開発が進み、政府も研究開発を後押ししている
    - 米国の量子関連株が大きく動くと、日本の関連株にも買いが波及しやすい
  watch:
    - 米国の量子コンピューター企業（IonQ など）の株価とニュース
    - 国内の研究機関・企業の開発発表
  risk:
    - 実用化はまだ先で、業績への貢献は小さい。期待だけで株価が動きやすい
    - 話題性で急騰したあとの反落が大きい

海運:
  seo: 海運株
  about: コンテナ船・ばら積み船・タンカーなどで貨物を運ぶ海運会社のテーマです。日本郵船、商船三井、川崎汽船の大手3社が中心で、配当利回りの高さでも知られています。
  why:
    - 運賃市況（コンテナ・ばら積み）の変動で業績が大きく動く
    - 紅海の通航問題など、航路の混乱が起きると運賃が上がりやすい
    - 自社株買い・増配など株主還元に積極的な会社が多い
  watch:
    - コンテナ運賃指数・ばら積み船運賃（バルチック海運指数）
    - 米国の関税政策と世界の荷動き
    - 各社の配当方針の見直し
  risk:
    - 運賃が下がると利益が大きく減り、配当も減りやすい
    - 円高は業績の目減り要因

メガバンク:
  seo: メガバンク・銀行株
  about: 三菱UFJ、三井住友FG、みずほFGの3大銀行グループと、りそなHD、ゆうちょ銀行のテーマです。金利の動きが業績を大きく左右します。
  why:
    - 日銀の利上げで、貸出金利と預金金利の差（利ざや）が広がり、利益が増えやすい
    - 増配・自社株買いなど株主還元の強化
    - 政策保有株の売却で資本効率の改善が進んでいる
  watch:
    - 日銀の金融政策決定会合（利上げの時期）
    - 長期金利（10年国債利回り）の動き
    - 各社の決算と還元方針
  risk:
    - 利上げが見送られる・金利が下がると売られやすい
    - 景気悪化による貸し倒れの増加

地方銀行:
  seo: 地方銀行株（地銀株）
  about: 横浜FG、千葉銀行、ふくおかFG、しずおかFGなど、地方を地盤とする銀行のテーマです。PBR（株価純資産倍率）が低い銘柄が多く、割安株としても注目されます。
  why:
    - 金利上昇で利ざやが改善し、長く続いた低収益から抜け出しつつある
    - 地銀どうしの経営統合・再編の思惑
    - PBR1倍割れの解消に向けた株主還元の強化
  watch:
    - 日銀の利上げと長期金利
    - 地銀の再編・提携のニュース
    - 中間・本決算での業績予想の修正
  risk:
    - 金利が下がる局面では売られやすい
    - 地域経済の悪化による貸し倒れ

保険（金利上昇メリット）:
  seo: 保険株（損保・生保）
  about: 東京海上、MS&AD、SOMPOの大手損保と、第一生命、T&Dなどの生保のテーマです。金利が上がると運用の利回りが良くなるため「金利上昇で恩恵を受ける株」とされます。
  why:
    - 金利上昇で、債券などで運用する利回りが改善する
    - 損保は政策保有株の売却を進め、売却益を株主還元に回している
    - 海外の保険事業の買収などで成長を目指している
  watch:
    - 日銀の利上げと長期金利
    - 大きな自然災害（損保の保険金支払いが増える）
    - 各社の還元方針
  risk:
    - 大規模な災害が起きると損保の利益が大きく減る
    - 株式市場が下がると保有株の価値が目減りする

防衛:
  seo: 防衛関連株
  about: 戦闘機・艦船・ミサイル・弾薬・電子機器など、防衛装備品をつくる企業のテーマです。三菱重工、川崎重工、IHIの重工3社のほか、豊和工業、石川製作所、東京計器などの中小型株も含まれます。
  why:
    - 防衛費を大きく増やす国の方針で、装備品の受注が増えている
    - 安全保障に関わる国の基本方針（安保3文書）の見直しの議論
    - 世界的な安全保障環境の緊張で、各国の防衛費も増えている
  watch:
    - 防衛予算（概算要求・本予算）の規模
    - 防衛装備品の輸出ルールの見直し
    - 国際情勢のニュース
  risk:
    - 中小型株は思惑で急騰・急落しやすい（当サイトでも「投機的過熱」が付きやすい）
    - 国の予算や政策の変更に業績が左右される

宇宙:
  seo: 宇宙関連株
  about: ロケット、人工衛星、月面探査、宇宙ごみ（デブリ）除去など、宇宙ビジネスに関わる企業のテーマです。ispace、アストロスケール、三菱重工（H3ロケット）などが含まれます。
  why:
    - 政府の「宇宙戦略基金」など、宇宙産業を育てる国の支援が大きくなっている
    - 米国の宇宙関連企業の上場・株価上昇が日本の関連株にも波及しやすい
    - ロケットの打ち上げや月面着陸など、話題になりやすいイベントが多い
  watch:
    - ロケット打ち上げ・月面探査などのミッションの日程と結果
    - 米国の宇宙関連株（宇宙ETFなど）の動き
    - 国の宇宙予算
  risk:
    - 赤字の企業が多く、株価は期待で動く。ミッションの失敗で急落することがある
    - 新株発行による資金調達で、株価が下がることがある

レアアース:
  seo: レアアース関連株
  about: モーターの磁石や電子部品に欠かせないレアアース（希土類）など、重要な鉱物の調達・精製・リサイクルに関わる企業のテーマです。住友金属鉱山、三井金属、東邦亜鉛、豊田通商などが含まれます。
  why:
    - レアアースの生産を握る中国が輸出規制を強め、調達先を分散する動きが広がっている
    - 南鳥島沖の海底のレアアース泥など、国内での確保に向けた取り組み
    - 電気自動車・ロボット・防衛装備品など、磁石の需要が伸びている
  watch:
    - 中国の輸出規制のニュース
    - 日米などの重要鉱物の確保に関する合意
    - 海底資源の試掘・調査の進み具合
  risk:
    - 政策ニュースで短期的に急騰しやすく、材料が出尽くすと反落しやすい
    - 資源価格の下落

電力・原発:
  seo: 原発関連株・電力株
  about: 東京電力HD、関西電力、九州電力などの電力会社と、原子力発電所の部品・建設に関わる日本製鋼所、日揮HDなどのテーマです。
  why:
    - データセンターの増加などで、電力需要が増えるという見通し
    - 原発の再稼働や、次世代の小型原子炉（SMR）の開発
    - 脱炭素の流れで原子力が見直されている
  watch:
    - 各地の原発の再稼働の審査・地元の同意
    - 国のエネルギー基本計画
    - 燃料価格（LNG・石炭）と電気料金
  risk:
    - 原発の再稼働が遅れると業績の改善も遅れる
    - 燃料価格の上昇で電力会社の利益が圧迫される

ゲーム・エンタメ:
  seo: ゲーム関連株
  about: 任天堂、ソニーG、カプコン、スクウェア・エニックス、バンダイナムコなど、ゲーム・アニメ・キャラクターを手がける企業のテーマです。
  why:
    - 人気ゲーム機の新型の普及と、対応ソフトの販売
    - アニメ・キャラクターなど日本のコンテンツが海外で人気を高めている
    - 映画・グッズなど、ゲーム以外へのキャラクターの展開
  watch:
    - 大型タイトルの発売日と販売本数
    - 各社の決算（ヒット作の有無で業績が大きく変わる）
    - 円相場（海外売上の比率が高い）
  risk:
    - ヒット作に業績が左右され、発売の延期や販売不振で株価が下がりやすい
    - 円高は海外売上の目減り要因

IT・コンサル:
  seo: ITサービス・コンサル関連株
  about: 企業のDX（デジタル化）を手伝うシステム開発・ITコンサルの企業のテーマです。野村総研、ベイカレント、TIS、フューチャー、大塚商会などが含まれます。
  why:
    - 古いシステムの入れ替えや、生成AIの導入などで企業のIT投資が続いている
    - IT人材の不足で、コンサル・システム開発の単価が上がっている
  watch:
    - 各社の受注残と決算
    - 企業のIT投資計画（日銀短観のソフトウェア投資など）
  risk:
    - 生成AIで開発の仕事が減るのではという見方が出ると売られやすい
    - 人件費の上昇で利益率が下がる

インバウンド:
  seo: インバウンド関連株
  about: 訪日外国人（インバウンド）の消費で恩恵を受ける企業のテーマです。百貨店（三越伊勢丹・高島屋）、ドン・キホーテのPPIH、オリエンタルランド、航空会社（JAL・ANA）などが含まれます。
  why:
    - 訪日外国人の数が過去最高の水準で推移している
    - 円安で日本での買い物・旅行が割安になっている
  watch:
    - 毎月の訪日外客数（日本政府観光局）
    - 中国からの旅行者の動き（外交関係に左右される）
    - 円相場
  risk:
    - 円高に振れると、免税売上などが鈍りやすい
    - 外交関係の悪化で、特定の国からの旅行者が急に減ることがある

建設・国土強靭化:
  seo: 建設株・国土強靭化関連株
  about: 大成建設、鹿島、大林組、清水建設のスーパーゼネコン4社と、通信工事のコムシスHD、セメントの太平洋セメントなどのテーマです。
  why:
    - 防災・インフラの老朽化対策など、国土強靭化の予算が続いている
    - 半導体工場・データセンター・都市の再開発など、民間の大型工事が多い
    - 工事の値上げが通り、利益率が改善している
  watch:
    - 国の補正予算・国土強靭化の計画
    - 各社の受注高と利益率
    - 大きな災害の後の復旧需要
  risk:
    - 資材費・人件費の上昇で利益が圧迫される
    - 人手不足で工事が遅れる

食品（ディフェンシブ）:
  seo: 食品株
  about: JT、味の素、アサヒGHD、キリンHD、明治HD、日本ハムなど、食品・飲料の企業のテーマです。景気に左右されにくい「ディフェンシブ株」として、相場が不安定なときに買われやすい特徴があります。
  why:
    - 相場が荒れたときの資金の逃げ先として買われやすい
    - 値上げが定着し、利益率が改善している
    - 配当が安定していて、配当目当ての買いが入りやすい
  watch:
    - 原材料（穀物・カカオなど）の価格と円相場
    - 食品の消費税の扱いなど、税制のニュース
    - 相場全体の不安が強まったとき（市場の温度計が「悲観」側）
  risk:
    - 相場が強い局面では、ほかのテーマに資金が移り出遅れやすい
    - 原材料高・円安でコストが上がる
