# ブログ記事の「今日の見方」の型
#
# 毎朝、その日のデータで「条件」に当てはまる型の中から、いちばん目立つものを1〜2個選んで記事に入れます。
# ここに載っている文だけが記事に出ます（ここにない意見を仕組みが勝手に書くことはありません）。
#
# 確認のしかた：
#   - 自分の考えと違う型 → 行ごと消す
#   - 言い回しが違う     → 「文」を自分の言葉に直す（{ } の中はそのまま残す）
#   - 足したい見方       → 同じ形で書き足す（条件は日本語で書けば、仕組みに合わせて直します）
#
# { } の中は、その日の数字やテーマ名に置き換わります。
# 文が { で始まるときは、文全体を ' ' で囲んでください（囲まないとファイルが読めなくなります）。
# 新しい型（id）を書き足したときは、当てはまる条件の判定を theme_score.py に足すまで記事には出ません。

# ── 市場全体（市場の温度計） ─────────────────────────
- id: mood_hot
  条件: 温度計が75以上
  文: 温度計は{温度}で楽観に傾いています。こういう日に新しく買うと高値づかみになりやすいので、買うなら分けて少しずつにしたい場面です。

- id: mood_cold
  条件: 温度計が30以下
  文: 温度計は{温度}まで冷えています。悲観が強いときほど、業績のよい銘柄まで一緒に売られます。慌てて売るより、拾いたい銘柄の候補を整理しておく日だと見ています。

- id: mood_jump
  条件: 温度計が前日より8以上上がった
  文: 温度計は{前日温度}から{温度}へ一気に上がりました。1日で気分が変わったときは、翌日以降に続くかどうかを確かめてから動いても遅くありません。

- id: mood_drop
  条件: 温度計が前日より8以上下がった
  文: 温度計は{前日温度}から{温度}へ急に下がりました。原因が一時的なニュースなのか、景気や金利の流れの変化なのかで、その後の戻りがまったく違ってきます。

- id: vix_high
  条件: VIXが25以上
  文: 米国のVIXが{VIX}と高めです。米国が不安定なあいだは、日本株も朝の寄り付きで振らされやすくなります。

- id: adr_hot
  条件: 騰落レシオが120以上
  文: 騰落レシオは{騰落レシオ}で、買われすぎの目安の120を超えています。全体が上がっているときほど、出遅れた銘柄より、すでに上がった銘柄の利益確定に目を向けたいところです。

- id: adr_cold
  条件: 騰落レシオが75以下
  文: 騰落レシオは{騰落レシオ}で、売られすぎの水準に近づいています。過去にもこの水準のあたりで下げが止まったことは多く、反発のきっかけを待つ場面です。

- id: fear_news
  条件: 不安ニュースが平常の2倍以上
  文: 「急落」「リスクオフ」などのニュースが平常の{不安ニュース}倍に増えています。ニュースが騒がしい日は、値動きが実態以上に大きくなりやすいので注意しています。

# ── テーマの順位・勢い ───────────────────────────────
- id: top_streak
  条件: 同じテーマが3営業日以上続けて1位
  文: '{テーマ}は{連続}営業日続けて1位です。人気が続いているあいだは主役の銘柄が買われますが、そろそろ同じテーマの出遅れ銘柄にも目を向けたい時期です。'

- id: new_top
  条件: 前日2位以下のテーマが1位になった
  文: 今日の1位は{テーマ}（{点}点）で、前日の{前日順位}位から上がってきました。主役が入れ替わった初日なので、明日も上位に残るかを見ています。

- id: surge
  条件: 注目度が前日より15点以上上がったテーマがある
  文: '{テーマ}の注目度が前日から{前日比}点上がりました。引っぱったのは{牽引}です。1日だけの急な上げは翌日に戻すことも多く、続くかどうかが大事です。'

- id: fade
  条件: 前日上位3位以内のテーマが、10点以上下がって順位を落とした
  文: 前日まで上位にいた{テーマ}は{前日比}点下がりました。人気のテーマから資金が抜け始めるときは、まず売買代金が減ります。明日の売買代金に注目しています。

- id: crowded
  条件: 上位5テーマのうち4つ以上が同じ分野（例：金融・内需）
  文: 上位は{分野}のテーマに偏っています。資金が一つの分野に集まっているときは、そこから外れたテーマに割安なものが残りやすいと考えています。

- id: broad
  条件: 上位テーマの上昇比率がどれも8割以上
  文: 上位のテーマでは、ほとんどの銘柄がそろって上がっています。一部の大型株だけでなく中小型まで買われているのは、地合いのよいサインと見ています。

# ── お金の流れ（売買代金）───────────────────────────
- id: money_first
  条件: 売買代金が平常の1.8倍以上なのに、株価スコアは55未満のテーマ
  文: '{テーマ}は売買代金が平常の{代金倍率}倍に増えた一方で、株価はまだ大きく動いていません。お金が先に入り始めているので、ここから数日の値動きを監視しています。'

- id: money_fade
  条件: 注目度は上位だが、売買代金が平常の0.8倍以下
  文: '{テーマ}は順位こそ上位ですが、売買代金は平常の{代金倍率}倍と細っています。参加者が少ないまま上がっている状態なので、勢いを過信しないようにしています。'

# ── これから動きそうなテーマ（先回り）────────────────
- id: early_news
  条件: 先回りスコア上位で、ニュースが急増しているのに株価はまだ平常
  文: '{テーマ}は関連ニュースが{ニュース倍率}倍に増えていますが、株価はまだ平常の範囲です。ニュースが先、株価があとから動くことが多いので、先回りの候補として見ています。'

- id: early_event
  条件: 先回りスコア上位で、7日以内にイベントや決算がある
  文: '{テーマ}は{イベント}を控えています。イベントの前に期待で買われ、当日に材料出尽くしで売られる流れはよくあるので、買うなら早め、当日は様子見と考えています。'

- id: us_lead
  条件: 米国の同じ分野のETFが前日に2%以上動いた
  文: 前日の米国では{米国ETF}が{米国騰落}動きました。米国の動きは翌朝の日本の同じテーマにつながりやすく、{テーマ}の寄り付きに注目しています。

# ── 決算 ─────────────────────────────────────────
- id: surprise_many
  条件: 決算サプライズ（上方修正・増配・大幅増益）が10銘柄以上
  文: 直近の開示で上方修正・増配・大幅増益の銘柄が{サプライズ数}銘柄と多めです。全体が弱い日でも、好決算の銘柄は下げにくい傾向があります。

- id: surprise_theme
  条件: 決算サプライズの銘柄が、上位テーマに含まれる
  文: '{テーマ}の{銘柄}が{サプライズ内容}を発表しました。テーマの人気に業績の裏付けが加わった形で、一時的な人気だけで上がっている銘柄とは分けて見ています。'

# ── 静かな日 ─────────────────────────────────────
- id: quiet
  条件: 上の型がどれも当てはまらない
  文: 今日は目立った変化の少ない一日でした。こういう日は無理に売買せず、上位テーマの顔ぶれが入れ替わるかどうかを確かめながら待つのが自分の考え方です。
