# 平日の朝にレポートを作り、GitHub Pages（https://adsl77jp-cmyk.github.io/kabu/）で公開する
# お名前.com のレンタルサーバーにも置く場合は Secrets（Settings → Secrets and variables → Actions）を登録:
#   FTP_HOST      FTPサーバー名（お名前.com のコントロールパネルに表示）
#   FTP_USER      FTPユーザー名
#   FTP_PASSWORD  FTPパスワード
#   FTP_DIR       アップ先フォルダ（ログイン直後の場所から。例: public_html/example.com）
# 未登録の間は FTP アップロードを飛ばす。
name: daily-report

on:
  schedule:
    - cron: "30 23 * * 0-4"  # 日本時間 月〜金 8:30（UTC 日〜木 23:30）。混雑時は数分〜十数分遅れる
  workflow_dispatch:          # Actions 画面の「Run workflow」で手動実行
  push:                       # ページの作り方を変えたらすぐ公開し直す（毎朝のデータ保存コミットでは動かない）
    branches: [main]
    paths: [theme_score.py, themes.yaml, events.yaml, watchwords.yaml, assets/**, static/**, .github/workflows/daily.yml]

permissions:
  contents: write  # キャッシュ・履歴をリポジトリに保存し直すため
  pages: write     # GitHub Pages への公開
  id-token: write

concurrency: daily-report

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Asia/Tokyo  # 日付の判定を日本時間で
      FTP_HOST: ${{ secrets.FTP_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: ライブラリのインストール
        run: pip install -r requirements.txt

      - name: レポート作成
        run: python theme_score.py

      - name: GitHub Pages 用に準備
        run: touch public/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: GitHub Pages へ公開
        id: deploy
        uses: actions/deploy-pages@v4

      - name: お名前.com へアップロード（FTPS）
        if: env.FTP_HOST != ''
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          cd public
          find . -type f ! -name .nojekyll | sed 's|^\./||' | while read -r f; do
            curl --fail --silent --show-error --ssl-reqd --ftp-create-dirs \
              --user "$FTP_USER:$FTP_PASSWORD" \
              -T "$f" "ftp://$FTP_HOST/${FTP_DIR%/}/$f"
          done

      - name: キャッシュと履歴を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "data: $(date +%F)"
          git push
